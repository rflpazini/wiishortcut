[project]
name = "wiishortcut"
version = "0.1.0"
description = "Build Wii USB Loader GX shortcut channels on macOS"
readme = "README.md"
authors = [
    { name = "Rafael Pazini", email = "rflpazini@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "libWiiPy>=0.6.0,<0.7",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
wiishortcut = "wiishortcut.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=wiishortcut --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["wiishortcut"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options in argument defaults. That is the API, not a bug.
"src/wiishortcut/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
packages = ["wiishortcut"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false
